<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parano1d Explorer</title>
  <meta name="description" content="Block explorer and permanent transaction history for the Parano1d network" />
  <meta name="theme-color" content="#050908" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="site-header">
    <header class="topbar">
      <a class="brand" href="/" data-link>
        <img class="mark" src="/favicon-48.png" alt="" width="22" height="22" />
        <span>Parano1d <em>Explorer</em></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <form id="search-form" class="search" autocomplete="off">
        <input id="search-input" type="text" placeholder="Block height, hash, txid or address" />
        <button type="submit">Search</button>
      </form>
    </header>
    <div id="ticker" class="ticker"></div>
  </div>

  <main id="app"></main>

  <footer class="site-footer">
    <span>Independent community project</span>
    <span>No warranty for accuracy or completeness</span>
    <a href="/about" data-link>About this explorer</a>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
