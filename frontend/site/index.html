<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parano1d Explorer</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">◆</span> Parano1d Explorer
    </a>
    <a href="/mempool" data-link class="nav-link">Mempool</a>
    <form id="search-form" class="search" autocomplete="off">
      <input id="search-input" type="text" placeholder="Block height, block hash, txid or address" />
      <button type="submit">Search</button>
    </form>
  </header>

  <div id="ticker" class="ticker"></div>

  <main id="app"></main>

  <footer class="footer">
    <p>
      Community-run Parano1d permanode. Records transaction history the node
      itself only keeps briefly. Design inspired by mempool.space, built
      independently for Parano1d.
    </p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
