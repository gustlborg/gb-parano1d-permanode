<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parano1d Explorer</title>
  <link rel="preload" href="/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="site-header">
    <header class="topbar">
      <a class="brand" href="/" data-link>
        <span class="mark"></span>
        <span>Parano1d <em>Explorer</em></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <form id="search-form" class="search" autocomplete="off">
        <input id="search-input" type="text" placeholder="Block height, hash, txid or address" />
        <button type="submit">Search</button>
      </form>
    </header>
    <div id="ticker" class="ticker"></div>
  </div>

  <main id="app"></main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
