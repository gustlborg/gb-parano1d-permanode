[package]
name = "parano1d-permanode"
version = "0.1.11"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Permanent transaction history and block explorer for a Parano1d node"

[lib]
name = "parano1d_permanode"
path = "src/lib.rs"

[[bin]]
name = "parano1d-permanode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
hex = "0.4"
include_dir = "0.7"
log = "0.4.34"
mime_guess = "2"
# getBlock fallback decoder (see src/decode.rs): links the node's own
# crates so transaction-field derivation stays byte-identical to
# noid_rpc's get_block_details, instead of reimplementing txid/bech32m/
# paged-spend logic ourselves.
noid_chain = { git = "https://git.parano1d.org/ignotusnemo/parano1d.git", tag = "v1.1.0" }
permanode-core = { path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
toml = "1.1.6"
tower-http = { version = "0.6", features = ["fs", "cors"] }
ureq = { version = "3.4.2", features = ["json"] }
